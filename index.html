<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ECHO — 경험을 기록하고, 나를 발견하다</title>
    <meta
      name="description"
      content="말하거나 적은 경험을 AI가 정리하고 연결해 나만의 별자리와 패턴으로 보여주는 경험 기록 서비스."
    />
    <meta name="theme-color" content="#02040d" />

    <!-- 공유 미리보기. og:image는 아직 없으므로(랜딩 히어로 캡처를 넣을 자리다)
         비워 두지 않고 파일이 생기면 바로 보이도록 경로만 잡아 둔다.
         → public/assets/landing/og-image.png (1200×630) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ECHO" />
    <meta property="og:title" content="ECHO — 경험을 기록하고, 나를 발견하다" />
    <meta
      property="og:description"
      content="말하거나 적은 경험을 AI가 정리하고 연결해 나만의 별자리와 패턴으로 보여주는 경험 기록 서비스."
    />
    <meta property="og:image" content="/assets/landing/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ECHO — 경험을 기록하고, 나를 발견하다" />
    <meta
      name="twitter:description"
      content="말하거나 적은 경험을 AI가 정리하고 연결해 나만의 별자리와 패턴으로 보여주는 경험 기록 서비스."
    />
    <!-- Pretendard v1.3.9 (OFL) — dynamic subset, glyph 청크를 실제 쓰는 만큼만 내려받는다 -->
    <link rel="stylesheet" href="/fonts/pretendard/pretendardvariable-dynamic-subset.css" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
